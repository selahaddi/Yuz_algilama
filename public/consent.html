<!-- Ambient Background Illustration -->
<div class="bg-cover bg-center" data-alt="A soft-focus, abstract background representing memory and connection. Gentle flares of light in warm champagne and rose gold hues, reminiscent of bokeh at an elegant evening reception. The overall mood is romantic, secure, and ethereal." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBqvtpNwAuVtObRcBDy6tsi0jaWqMZl3AAmAPL6cCjSgrNM7wWQ542q84KYctRcCMJY8XrDZY9ZWZwakvADxW9BcETSWebQspB1ADrNt6gH3OzAO_aWsDwQqbImFYUy4nDCY0IquH7fKxlDhaQKohtSdXe5jIWcCVCRZZxMomtMhtDs_HRjt-ux8IZkZHOLzqqIDKzdIARfg1d94le1T7H9qb9SJl7d5-kMyFsa0ax-IqWlclcxSUbQ9Q')"></div>
<!-- The Content Card -->
<div class="relative z-10 w-full max-w-[600px] bg-surface/80 backdrop-blur-2xl rounded-2xl shadow-xl p-md lg:p-xl flex flex-col items-center text-center gap-xl transition-all duration-500 transform hover:-translate-y-1">
<!-- Header -->
<div class="flex flex-col items-center gap-sm">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">
                lock_person
            </span>
<h1 class="font-display-lg-mobile lg:font-display-lg text-display-lg-mobile lg:text-display-lg text-on-surface">
                Anılarınızı Gizlilikle Koruyoruz
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[400px]">
                Fotoğraflarınızı bulmak için güvenli yüz tanıma teknolojisi kullanıyoruz. Gizliliğiniz bizim en önemli önceliğimizdir.
            </p>
</div>
<!-- Decorative Divider -->
<div class="w-16 h-1 bg-outline-variant rounded-full"></div>
<!-- Consent Area -->
<div class="flex flex-col gap-md w-full text-left bg-surface-container-low rounded-xl p-md shadow-sm">
<label class="flex items-start gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center mt-1">
<input class="peer sr-only" id="consent-checkbox" type="checkbox"/>
<div class="w-6 h-6 rounded-md bg-surface-container-highest transition-colors duration-200 peer-checked:bg-primary flex items-center justify-center shadow-inner group-hover:bg-primary/20">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 transition-opacity duration-200 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">
                            check
                        </span>
</div>
</div>
<span class="font-body-md text-body-md text-on-surface-variant flex-1 select-none">
                    Eşleştirme amaçlı yüz verilerimin işlenmesini kabul ediyorum ve etkinlikten sonra güvenli bir şekilde silineceğini anlıyorum.
                </span>
</label>
<div class="flex items-center gap-xs ml-[36px]">
<span class="material-symbols-outlined text-[14px] text-outline">shield</span>
<a class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors underline underline-offset-2" href="#">KVKK Politikasının Tamamını Oku</a>
</div>
</div>
<!-- Action -->
<div class="w-full mt-sm">
<button class="w-full py-4 px-xl rounded-full bg-surface-container-highest text-on-surface-variant font-title-lg text-title-lg transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed group relative overflow-hidden flex items-center justify-center gap-sm" disabled="" id="enter-btn">
<span class="relative z-10 transition-colors duration-300 group-enabled:text-on-primary">Kutlamaya Katıl</span>
<span class="material-symbols-outlined relative z-10 text-[20px] transition-colors duration-300 group-enabled:text-on-primary opacity-0 group-enabled:opacity-100 -translate-x-2 group-enabled:translate-x-0 transition-all">
                    arrow_forward
                </span>
<div class="absolute inset-0 bg-primary opacity-0 transition-opacity duration-300 group-enabled:opacity-100"></div>
</button>
</div>
</div>
<script>
        const GUEST_API_URL = 'https://guest-api-398389727192.europe-west4.run.app';

        document.addEventListener('DOMContentLoaded', () => {
            const checkbox = document.getElementById('consent-checkbox');
            const enterBtn = document.getElementById('enter-btn');
            
            const urlParams = new URLSearchParams(window.location.search);
            const eventId = urlParams.get('event_id');

            if (eventId) {
                // Fetch event details to show real title instead of template
                fetch(GUEST_API_URL + '/api/event/' + eventId, {
                    headers: { 'Bypass-Tunnel-Reminder': 'true' }
                })
                .then(res => {
                    if (res.ok) return res.json();
                    throw new Error('Event not found');
                })
                .then(data => {
                    document.querySelector('.font-headline-md').innerText = data.title;
                    if(data.event_date) {
                        document.querySelector('.font-label-sm').innerText = data.event_date;
                    }
                    if (data.primary_color) {
                        document.documentElement.style.setProperty('--primary', data.primary_color);
                    }
                })
                .catch(err => console.error(err));
            }

            checkbox.addEventListener('change', (e) => {
                if (e.target.checked) {
                    enterBtn.removeAttribute('disabled');
                    enterBtn.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
                } else {
                    enterBtn.setAttribute('disabled', 'true');
                    enterBtn.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
                }
            });
            
            enterBtn.addEventListener('click', () => {
                if (checkbox.checked && eventId) {
                    localStorage.setItem('kvkk_accepted', 'true');
                    window.location.href = 'index.html?event_id=' + eventId;
                }
            });
        });
    </script>
</div></main><footer class="w-full bg-surface-container-lowest py-xl border-t border-outline-variant/20"><div class="max-w-[1280px] mx-auto px-margin-mobile lg:px-margin-desktop flex flex-col items-center text-center gap-md"><span class="font-headline-md text-primary">Sonsuza Dek Birlikte</span></div></footer></body></html>
